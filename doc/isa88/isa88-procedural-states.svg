<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-label="ISA-88 procedural state diagram with 12 states">
  <title>ISA-88 procedural states (IEC 61512-1 / ISA-88.00.01)</title>
  <style>
    :root { --bg:#ffffff; --fg:#18202b; --muted:#586374; --edge:#4a5566;
      --reg-outer:#e4e9ef; --reg-mid:#ecf0f4; --reg-in:#f6f8fa; --reg-line:#c3ccd7;
      --rest-fill:#ffffff; --rest-line:#18202b; --act-fill:#fbeed6; --act-line:#a86b12;
      --final-fill:#dde8f7; --final-line:#2c5a9e; --cmd:#3d4757; }
    @media (prefers-color-scheme: dark) { :root { --bg:#171d26; --fg:#e5eaf0; --muted:#98a3b3; --edge:#a7b1bf;
      --reg-outer:#232c38; --reg-mid:#1e2631; --reg-in:#1a212b; --reg-line:#364355;
      --rest-fill:#1b222c; --rest-line:#e5eaf0; --act-fill:#3a2a10; --act-line:#e0a24a;
      --final-fill:#18273d; --final-line:#7aa6e6; --cmd:#c9d1dc; } }
    .bg { fill: var(--bg); }
    .title { font-family: "IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif; font-weight:700; font-size:18px; fill:var(--fg); }
    .std { font-family: "IBM Plex Mono",Consolas,monospace; font-size:9.5px; letter-spacing:0.04em; fill:var(--muted); }
    .reg { stroke: var(--reg-line); stroke-width: 1; }
    .reg.o { fill: var(--reg-outer); } .reg.m { fill: var(--reg-mid); } .reg.i { fill: var(--reg-in); }
    .rl { font-family: "IBM Plex Mono",Consolas,monospace; font-size: 9px; fill: var(--muted); letter-spacing: 0.03em; }
    .st rect { stroke-width: 1.5; }
    .rest rect { fill: var(--rest-fill); stroke: var(--rest-line); }
    .act rect { fill: var(--act-fill); stroke: var(--act-line); }
    .fin rect { fill: var(--final-fill); stroke: var(--final-line); }
    .st text { font-family: "IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif; font-weight: 600; font-size: 12.5px; fill: var(--fg); text-anchor: middle; dominant-baseline: middle; }
    .st text.sub { font-family: "IBM Plex Mono",Consolas,monospace; font-weight: 400; font-size: 8.5px; fill: var(--muted); }
    .st .ring { fill: none; stroke-width: 1; stroke: var(--rest-line); }
    .e { fill: none; stroke: var(--edge); stroke-width: 1.3; }
    .e.sc { stroke-dasharray: 4 3; }
    .ah { fill: var(--edge); }
    .c { font-family: "IBM Plex Mono",Consolas,monospace; font-size: 9.5px; fill: var(--cmd); text-anchor: middle; }
    .c.s { text-anchor: start; } .c.n { text-anchor: end; }
    .sw-rest{fill:var(--rest-fill);stroke:var(--rest-line);stroke-width:1.5} .sw-act{fill:var(--act-fill);stroke:var(--act-line);stroke-width:1.5}
    .sw-final{fill:var(--final-fill);stroke:var(--final-line);stroke-width:1.5} .sw-exec{fill:var(--exec-fill);stroke:var(--exec-line);stroke-width:1.5}
    .lg { font-family: "IBM Plex Sans",Arial,sans-serif; font-size: 10.5px; fill: var(--muted); }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="600"/>
  <defs><marker id="ah1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>

  <g transform="translate(0,40)">
    <rect class="reg o" x="139" y="29" width="487" height="381" rx="14"/>
    <rect class="reg m" x="152" y="42" width="461" height="276" rx="12"/>
    <rect class="reg i" x="165" y="55" width="435" height="152" rx="10"/>
    <text class="rl" x="148" y="39">ABORT APPLIES</text>
    <text class="rl" x="161" y="52">STOP APPLIES</text>
    <text class="rl" x="174" y="68">HOLD APPLIES</text>

    <g marker-end="url(#ah1)">
      <path class="e" d="M132,170 H178"/>
      <path class="e sc" d="M282,170 H628"/>
      <path class="e" d="M262,150 V125 H530 V110"/>
      <path class="e sc" d="M478,90 H432"/>
      <path class="e" d="M328,90 H210 V150"/>
      <path class="e" d="M530,207 V245"/>
      <path class="e sc" d="M478,265 H432"/>
      <path class="e" d="M328,265 H282"/>
      <path class="e sc" d="M230,245 V190"/>
      <path class="e" d="M230,285 V300 H545 V285"/>
      <path class="e" d="M530,318 V355"/>
      <path class="e sc" d="M478,375 H432"/>
      <path class="e" d="M328,375 H110 V190"/>
      <path class="e" d="M530,410 V450"/>
      <path class="e sc" d="M478,470 H432"/>
      <path class="e" d="M328,470 H80 V190"/>
      <path class="e" d="M680,190 V520 H50 V190"/>
    </g>
    <text class="c" x="155" y="163">Start</text>
    <text class="c" x="455" y="163">SC</text>
    <text class="c" x="400" y="139">Pause</text>
    <text class="c" x="455" y="83">SC</text>
    <text class="c" x="268" y="83">Resume</text>
    <text class="c s" x="538" y="230">Hold</text>
    <text class="c" x="455" y="258">SC</text>
    <text class="c" x="305" y="258">Restart</text>
    <text class="c n" x="222" y="222">SC</text>
    <text class="c" x="305" y="297">Hold</text>
    <text class="c s" x="538" y="341">Stop</text>
    <text class="c" x="455" y="368">SC</text>
    <text class="c" x="220" y="368">Reset</text>
    <text class="c s" x="538" y="434">Abort</text>
    <text class="c" x="455" y="463">SC</text>
    <text class="c" x="220" y="463">Reset</text>
    <text class="c" x="380" y="514">Reset</text>

    <g class="st rest"><rect x="28" y="150" width="104" height="40" rx="6"/><rect class="ring" x="24" y="146" width="112" height="48" rx="8"/><text x="80" y="165">Idle</text><text class="sub" x="80" y="179">initial</text></g>
    <g class="st act"><rect x="178" y="150" width="104" height="40" rx="6"/><text x="230" y="171">Running</text></g>
    <g class="st rest"><rect x="328" y="70" width="104" height="40" rx="6"/><text x="380" y="91">Paused</text></g>
    <g class="st act"><rect x="478" y="70" width="104" height="40" rx="6"/><text x="530" y="91">Pausing</text></g>
    <g class="st act"><rect x="178" y="245" width="104" height="40" rx="6"/><text x="230" y="266">Restarting</text></g>
    <g class="st rest"><rect x="328" y="245" width="104" height="40" rx="6"/><text x="380" y="266">Held</text></g>
    <g class="st act"><rect x="478" y="245" width="104" height="40" rx="6"/><text x="530" y="266">Holding</text></g>
    <g class="st fin"><rect x="328" y="355" width="104" height="40" rx="6"/><text x="380" y="376">Stopped</text></g>
    <g class="st act"><rect x="478" y="355" width="104" height="40" rx="6"/><text x="530" y="376">Stopping</text></g>
    <g class="st fin"><rect x="328" y="450" width="104" height="40" rx="6"/><text x="380" y="471">Aborted</text></g>
    <g class="st act"><rect x="478" y="450" width="104" height="40" rx="6"/><text x="530" y="471">Aborting</text></g>
    <g class="st fin"><rect x="628" y="150" width="104" height="40" rx="6"/><text x="680" y="171">Complete</text></g>
  </g>

  <text class="std" x="24" y="22">IEC 61512-1 / ISA-88.00.01 · PROCEDURAL ELEMENTS</text>
  <text class="title" x="24" y="44">ISA-88 procedural states</text>

  <g transform="translate(24,582)">
    <rect x="0" y="-9" width="22" height="13" rx="3" class="sw-rest"/><text class="lg" x="28" y="1">Quiescent: Idle, Paused, Held</text>
    <rect x="190" y="-9" width="22" height="13" rx="3" class="sw-act"/><text class="lg" x="218" y="1">Transient</text>
    <rect x="290" y="-9" width="22" height="13" rx="3" class="sw-final"/><text class="lg" x="318" y="1">Final</text>
    <line x1="370" y1="-3" x2="396" y2="-3" class="e"/><text class="lg" x="402" y="1">Command</text>
    <line x1="470" y1="-3" x2="496" y2="-3" class="e sc"/><text class="lg" x="502" y="1">SC: state complete</text>
  </g>
</svg>
